name: Report

# Builds the static report from the committed PEP/KO closes
# (data/PEP_KO_2018-01-01_2024-12-31.csv, provenance in the .json next to it)
# and publishes it to GitHub Pages. No network download, so the page only
# changes when the code or the committed prices change.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/make_report.py --prices data/PEP_KO_2018-01-01_2024-12-31.csv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
