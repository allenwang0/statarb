[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "statarb"
version = "0.1.0"
description = "Daily-bar pairs-trading backtester with a Kalman-filter hedge ratio, cointegration tests and a rolling-OLS baseline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.1",
    "plotly==7.1.0",
    "scipy==1.17.1",
    "statsmodels==0.15.0",
    "streamlit==1.67.0",
    "yfinance==1.8.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.170.15",
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "pytest==9.2.0",
    "ruff==0.17.4",
]
screenshots = ["playwright==1.65.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint.isort]
known-first-party = ["src", "conftest", "test_data"]
